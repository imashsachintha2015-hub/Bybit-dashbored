name: CI / Quality & Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-checks:
    name: Python Daemons & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8

      - name: Syntax & Lint Check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=scratch,research_archive,backtest/data
          # Verify compilation of critical daemons and libraries
          python -m py_compile launcher.py server.py daemons/*.py backend_lib/*.py

      - name: Run Python Unit Tests
        run: |
          if [ -d tests ]; then pytest tests/ -v; fi

  node-checks:
    name: Node.js Swarm & Agents Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Node Dependencies
        run: |
          npm ci || npm install

      - name: Validate Scripts & Agents
        run: |
          node -e "console.log('Validating Node syntax on core agent files...');"
          node --check agents/*.js analysts/*.js swarm/*.js bybit-ws.js app.js chart.js masis-engine.js || true
